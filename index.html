<!DOCTYPE html>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8edee;--ink:#12263a;--line:#9db3bd;--accent:#b8761f}
@media (prefers-color-scheme:dark){:root{--bg:#0f1c28;--ink:#e8edee;--line:#2f4a5c;--accent:#e0a64b}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;display:grid;place-items:center;padding:24px;overflow-x:hidden}
main{position:relative;width:100%;max-width:680px;text-align:left}
svg{position:absolute;right:-12%;top:50%;width:min(560px,95vw);transform:translateY(-50%);z-index:0;fill:none;stroke:var(--line);stroke-width:1.2;opacity:.8}
svg .top{stroke:var(--accent);stroke-width:2}
.content{position:relative;z-index:1}
h1{font-size:clamp(2.6rem,10vw,5.5rem);line-height:.95;font-weight:700;letter-spacing:-.03em}
p{margin-top:24px;font-size:1.15rem;line-height:1.5;max-width:30ch}
.status{margin-top:40px;display:inline-block;padding:10px 18px;border:2px solid var(--accent);border-radius:999px;font-weight:700;color:var(--accent)}
footer{margin-top:56px;font-size:.85rem;opacity:.65}
</style>
</head>

<svg viewBox="-100 -100 200 200" aria-hidden="true">

<div class="content">
<h1>Pangea<br>Venture</h1>

<footer>&copy; <span id="y">2026</span> Pangea Venture</footer>

<script>document.getElementById("y").textContent=new Date().getFullYear()</script>
